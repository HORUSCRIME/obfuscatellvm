version: '3.8'

services:
  obfuscatellvm:
    build: .
    container_name: obfuscatellvm-app
    ports:
      - "5000:5000"
    volumes:
      - ./examples:/app/examples:ro
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app/src
      - OBFUSCATE_LLVM_TELEMETRY=false
    command: python3 webui/app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/profiles"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  obfuscatellvm-cli:
    build: .
    container_name: obfuscatellvm-cli
    volumes:
      - ./examples:/app/examples:ro
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app/src
    profiles:
      - cli
    command: tail -f /dev/null

volumes:
  output:
    driver: local